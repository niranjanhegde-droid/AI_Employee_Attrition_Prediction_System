<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>

    {% block title %}
    Authentication
    {% endblock %}

</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:
    linear-gradient(
        135deg,
        #0f172a,
        #4f46e5,
        #06b6d4
    );

    background-size:400% 400%;

    animation:
    gradientMove 12s ease infinite;

    font-family:
    "Segoe UI",
    sans-serif;
}

@keyframes gradientMove{

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }
}

.auth-container{

    width:100%;
    max-width:1100px;

    display:grid;

    grid-template-columns:
    1fr 1fr;

    overflow:hidden;

    border-radius:30px;

    background:
    rgba(
        255,
        255,
        255,
        .08
    );

    backdrop-filter:
    blur(20px);

    box-shadow:
    0 20px 50px rgba(
        0,
        0,
        0,
        .25
    );
}

.left-panel{

    padding:60px;

    color:white;

    display:flex;

    flex-direction:column;

    justify-content:center;
}

.left-panel h1{

    font-size:3rem;

    font-weight:800;
}

.left-panel p{

    margin-top:20px;

    font-size:1.1rem;

    color:#dbeafe;

    line-height:1.8;
}

.feature{

    margin-top:15px;

    font-weight:600;
}

.right-panel{

    background:white;

    padding:50px;
}

.auth-title{

    text-align:center;

    font-weight:800;

    margin-bottom:30px;

    color:#0f172a;
}

.form-control{

    border-radius:15px;

    padding:12px 15px;

    height:55px;
}

.input-group-text{

    border-radius:15px 0 0 15px;
}

.btn-auth{

    height:55px;

    border-radius:15px;

    font-weight:700;

    font-size:1rem;
}

.bottom-link{

    text-align:center;

    margin-top:20px;
}

@media(max-width:900px){

.auth-container{

    grid-template-columns:1fr;
}

.left-panel{

    display:none;
}

}

</style>

</head>

<body>

<div class="auth-container">

    <div class="left-panel">

        <h1>

            Employee Attrition AI

        </h1>

        <p>

            Predict employee turnover before it happens.

            Analyze workforce satisfaction,
            wellness, engagement and
            retention using AI-powered
            HR analytics.

        </p>

        <div class="feature">
            ✓ Attrition Prediction
        </div>

        <div class="feature">
            ✓ Wellness Analytics
        </div>

        <div class="feature">
            ✓ Department Dashboard
        </div>

        <div class="feature">
            ✓ AI Recommendations
        </div>

    </div>

    <div class="right-panel">

        {% block auth_content %}
        {% endblock %}

    </div>

</div>

<script>

function togglePassword(id){

    let field =
    document.getElementById(id);

    if(field.type==="password"){

        field.type="text";

    }else{

        field.type="password";
    }
}

</script>

</body>
</html>
