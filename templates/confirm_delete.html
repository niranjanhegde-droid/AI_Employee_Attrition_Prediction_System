{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card shadow-lg border-0 rounded-4">

                <div class="card-body p-5">

                    <div class="text-center">

                        <i class="fas fa-user-slash text-danger"
                           style="font-size:70px;">
                        </i>

                        <h2 class="mt-4 text-danger fw-bold">
                            Delete Account
                        </h2>

                        <p class="text-muted">

                            This action cannot be undone.

                            Your account will be removed from the system.

                            However, attrition records will be retained
                            for analytics purposes.

                        </p>

                    </div>

                    <hr>

                    <form method="POST">

                        <div class="mb-4">

                            <label class="form-label fw-semibold">

                                Why are you leaving?

                            </label>

                            <select
                                name="reason"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select Reason
                                </option>

                                <option value="Better Opportunity">
                                    Better Opportunity
                                </option>

                                <option value="Higher Salary">
                                    Higher Salary
                                </option>

                                <option value="Career Growth">
                                    Career Growth
                                </option>

                                <option value="Higher Studies">
                                    Higher Studies
                                </option>

                                <option value="Relocation">
                                    Relocation
                                </option>

                                <option value="Work Life Balance">
                                    Work Life Balance
                                </option>

                                <option value="Management Issues">
                                    Management Issues
                                </option>

                                <option value="Personal Reasons">
                                    Personal Reasons
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>

                        <div class="d-grid gap-2">

                            <button
                                type="submit"
                                class="btn btn-danger btn-lg"
                            >

                                <i class="fas fa-trash-alt me-2"></i>

                                Confirm Delete Account

                            </button>

                            <a
                                href="/"
                                class="btn btn-outline-secondary btn-lg"
                            >

                                Cancel

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
